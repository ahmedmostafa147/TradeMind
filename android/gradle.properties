org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is off because this project lives on D: while
# the pub cache lives on C:. The incremental compiler's RelocatableFileToPathConverter
# computes a relative path from each plugin source file to the project root, and
# on Windows there is no relative path between two drive letters — it throws
# "different roots", fails to close its caches, and the whole build dies inside
# :image_picker_android:compileDebugKotlin.
#
# Cost is a slower rebuild of plugin Kotlin sources. The alternative fixes are
# moving the project to C: or repointing PUB_CACHE, both of which change the
# developer's machine rather than the project.
kotlin.incremental=false
