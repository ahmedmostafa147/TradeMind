name: egx_trade_journal
description: "دفتر صفقات البورصة المصرية — أوفلاين بالكامل، لإدارة حجم المركز والمخاطرة."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Equity curve only.
  fl_chart: ^1.2.0

  # Number/date formatting. NOTE: all formatters are constructed against locale 'en'
  # on purpose — see lib/core/formatters.dart.
  # Pinned to 0.20.2 (not the latest 0.20.3) because flutter_localizations from the
  # SDK pins it there; anything higher fails version solving.
  intl: 0.20.2

  uuid: ^4.5.1

  # Screenshot attachments. Gallery only — images are copied into the app's own
  # documents directory and referenced by path, never stored as bytes in Hive.
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  http: ^1.2.2
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  # Grapheme-cluster aware string handling. Already present transitively via
  # Flutter; declared because lib/ imports it directly (the avatar initial must
  # not split a surrogate pair or a combining mark).
  characters: ^1.4.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  bloc_test: ^10.0.0
  fake_cloud_firestore: ^4.2.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0B0D"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png

  # IBM Plex Sans Arabic is bundled rather than pulled through google_fonts,
  # which downloads at runtime — that would break the app's offline guarantee
  # and leave the first launch without a font until it had network. Three static
  # weights from the upstream family; OFL licence ships alongside.
  fonts:
    # Same three weights the site loads from the same TTFs (site/app/layout.tsx),
    # so type on the phone and type in the browser are identical.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-700.ttf
          weight: 700
